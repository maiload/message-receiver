spring:
  application:
    name: message-receiver

  datasource:
    url: jdbc:postgresql://localhost:5432/message_receiver
    username: maiload
    password: maiload
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: messaging

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: maiload
    password: maiload

  grpc:
    server:
      port: 9090

server:
  port: 8081

receiver:
  rate-limit:
    default-tps: 100
  idempotency:
    ttl-seconds: 86400
  rabbitmq:
    exchange: message.exchange
    routing-key: message.realtime
